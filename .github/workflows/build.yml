name: Sestavení pro Windows

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Vydání: když na hlavní větvi přibude verze z package.json, která ještě nemá Release (nebo při pushi tagu v*).
      - name: Je potřeba vydat novou verzi?
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          NEW=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then NEW=true
          elif [[ "$GITHUB_REF_NAME" == "${{ github.event.repository.default_branch }}" ]] && ! gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then NEW=true; fi
          echo "Verze $V, vydat: $NEW"
          echo "release=$NEW" >> "$GITHUB_OUTPUT"
      - if: steps.ver.outputs.release != 'true'
        run: npm run dist
      - if: steps.ver.outputs.release == 'true'
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: PsaniVsemiDeseti-Windows
          path: |
            dist/*.exe
            dist/latest.yml
