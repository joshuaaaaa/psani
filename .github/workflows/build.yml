name: Sestavení pro Windows

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Běžný push: jen sestavit. Tag v*: sestavit a zveřejnit jako Release (odtud se berou aktualizace).
      - if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run dist
      - if: startsWith(github.ref, 'refs/tags/v')
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: PsaniVsemiDeseti-Windows
          path: |
            dist/*.exe
            dist/latest.yml
